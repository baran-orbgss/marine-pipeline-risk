# MAR-033A GENERAL_CORRELATION_SENSITIVITY earthquake-liquefaction-triggering scenario.
#
# NOT a real earthquake hazard declaration for the Sheringham Shoal site -- identical rationale to
# sheringham_shoal_2008_cptu_liquefaction_synthetic_scenario.yaml (MAR-033), which this manifest
# mirrors exactly except for `fines`: instead of one silently-chosen fines-content value, it
# declares the automatic GENERAL_CORRELATION_SENSITIVITY mode, which fans out into all three
# literature-defined C_FC variants (-0.29, 0.0, +0.29) as three fully independent, separately
# product-manifested profiles -- never averaged, never reduced to one value, never a probability.
scenario_id: sheringham_shoal_sensitivity_benchmark_v1
earthquake:
  moment_magnitude_mw: 7.0
  pga_g: 0.15
  pga_reference: FREE_FIELD_SEABED_SURFACE_PGA
tip_resistance:
  mode: QC_PLUS_U2_AND_DECLARED_AREA_RATIO
  basis: >-
    SYNTHETIC_BENCHMARK: applies the cone area ratio (a = 0.75) that the 2008 GEO source report
    states for the Van den Berg 60-degree cone (Part C, C.4.2) but that MAR-032 explicitly does
    NOT apply on its own -- declared here as an explicit MAR-033 scenario input, not silently
    inferred.
  area_ratio: 0.75
stress:
  mode: SEABED_RELATIVE_LAYERED_STRESS
  water_unit_weight_kn_m3: 10.0
  layers:
    - top_depth_m: 0.0
      bottom_depth_m: 60.0
      total_unit_weight_kn_m3: 18.0
      basis: >-
        SYNTHETIC_BENCHMARK: assumed uniform saturated-sand total unit weight; not a source-stated
        Sheringham Shoal geotechnical property.
fines:
  source: GENERAL_CORRELATION_SENSITIVITY
  basis: >-
    MAR-033A: automatic CPT-Ic-based fines-content sensitivity across all three literature-defined
    C_FC values -- no fc_percent or c_fc is declared here; each of the three variants is resolved
    per-row from Ic and reported as its own separate, traceable profile.
soil_applicability:
  established: true
  basis_kind: SOURCE_ESTABLISHED
  basis: >-
    SYNTHETIC_BENCHMARK: assumed cohesionless (sand) throughout for the benchmark scenario; not a
    source-stated Sheringham Shoal soil classification.
static_shear_material: false
